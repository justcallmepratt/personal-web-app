name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # NOTE: this workflow is NOT part of the production deploy path (Railway +
  # Vercel handle that, via ci.yml). It only mirrors images to GHCR for
  # optional self-hosting. Both jobs fail fast (~5-10s) at the GHCR push step
  # rather than the actual docker build — that timing signature means the
  # default GITHUB_TOKEN is being denied `packages: write`, most likely
  # because the repo's Settings → Actions → General → "Workflow permissions"
  # is set to "Read repository contents permission" (read-only), which caps
  # what any workflow-declared `permissions:` block can request, no matter
  # what the YAML says.
  #
  # FIX (one-time, requires repo admin — 30s):
  #   GitHub → repo → Settings → Actions → General → Workflow permissions
  #   → select "Read and write permissions" → Save
  #
  # Until that's confirmed, both jobs are marked continue-on-error so this
  # optional workflow can no longer show as a "failing" check against pushes.
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/personal-web-app-backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/personal-web-app-frontend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BACKEND_URL=${{ secrets.BACKEND_URL || 'https://personal-web-app-backend-production.up.railway.app' }}
            NEXT_PUBLIC_API_URL=${{ secrets.BACKEND_URL || 'https://personal-web-app-backend-production.up.railway.app' }}
            NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME || 'V // Night City Dev' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://frontend-liard-theta-28.vercel.app' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
