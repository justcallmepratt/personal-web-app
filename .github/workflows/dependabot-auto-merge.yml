name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-approve and merge patch/minor updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Safe: patch and minor — merge once CI is green ───────────────────
      # No approval step: main does not require reviews, and this repository
      # does not let GitHub Actions approve pull requests.
      # --auto merges only after the required status checks on main pass.
      # It needs branch protection with required checks; without it this step
      # fails and nothing is merged.
      - name: Squash-merge patch/minor
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge "$PR_URL" --squash --auto --delete-branch

      # ── Risky: major version — comment and label, do NOT merge ───────────
      - name: Flag major update for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        continue-on-error: true  # the label may not exist yet
        env:
          DEPENDENCIES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          gh pr comment "$PR_URL" \
            --body "**Major version bump** for \`$DEPENDENCIES\`. This needs manual review before merging: check the changelog for breaking changes."
          gh pr edit "$PR_URL" --add-label "major-update"
