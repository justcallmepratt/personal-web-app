name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This workflow only verifies. Deployment is handled by Vercel's Git
# integration (see docs/DEPLOYMENT.md), so no job here needs secrets or
# more than a read-only token.
permissions:
  contents: read

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend — Java 21 / Maven
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B compile -q

      # One Maven run: unit and slice tests (H2 via the test profile), the PostgreSQL
      # integration tests (Testcontainers, using the runner's Docker), the JAR, and the
      # JaCoCo coverage gate, which is bound to the verify phase.
      - name: Test, package and coverage gate
        run: mvn -B verify
        env:
          SPRING_PROFILES_ACTIVE: test

      # Testcontainers skips the PostgreSQL tests when Docker is missing, which is right
      # on a laptop and wrong here: a skip must not look like a pass.
      - name: Check the PostgreSQL tests ran
        run: |
          for class in PostgresPersistenceTest PostgresSuggestionTest PostgresMarketResearchTest; do
            report=target/surefire-reports/TEST-com.resume.persistence.$class.xml
            test -f "$report" || { echo "::error::$report is missing: the PostgreSQL tests did not run"; exit 1; }
            head -n 5 "$report" | grep -o '<testsuite [^>]*' | tee /dev/stderr | grep -q ' skipped="0"' \
              || { echo "::error::$class was skipped (is Docker available on the runner?)"; exit 1; }
            if head -n 5 "$report" | grep -q ' tests="0"'; then echo "::error::No tests ran in $class"; exit 1; fi
          done

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Node 22 / pnpm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME || 'V // Night City Dev' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://example.com' }}

  # ── Admin micro-frontend ─────────────────────────────────────────────────
  admin:
    name: Admin — Node 22 / pnpm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-admin-${{ hashFiles('apps/admin/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-admin-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # ── JobSync importer (tools/jobsync-importer) ────────────────────────────
  # A command-line tool with no dependencies: nothing to install, lint or build.
  # Its tests use synthetic backups and a mock API on localhost; no network, no secrets.
  jobsync-importer:
    name: JobSync importer — Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/jobsync-importer

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test
        run: npm test

      # The command itself starts, and the shipped data files load.
      - name: Smoke run
        run: node bin/jobsync-importer.mjs --help

  # ── Kafka micro-frontend ─────────────────────────────────────────────────
  kafka:
    name: Kafka — Node 22 / pnpm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/kafka

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-kafka-${{ hashFiles('apps/kafka/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-kafka-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # ── Athlink demo (static Vite app, served under /projects/athlink) ────────
  athlink:
    name: Athlink — Node 22 / pnpm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/athlink

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-athlink-${{ hashFiles('apps/athlink/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-athlink-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app is a design-tool export kept as exported, so CI only checks that
      # it builds and that every asset lands under the /projects/athlink/ base.
      - name: Build
        run: pnpm build

      - name: Check the build layout
        run: |
          test -f build/projects/athlink/index.html
          ! grep -q 'src="/assets/' build/projects/athlink/index.html
