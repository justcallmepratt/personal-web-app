version: 2
updates:
  # GitHub Actions — keep action versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Maven — backend/pom.xml
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot:*"]
      jwt:
        patterns: ["io.jsonwebtoken:*"]

  # npm/pnpm — frontend/package.json
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR per run for all minor and patch bumps, so lockfile changes land
    # together instead of as several PRs that each rewrite pnpm-lock.yaml.
    # Major bumps still arrive one per dependency for manual review.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # npm/pnpm — apps/admin/package.json
  - package-ecosystem: npm
    directory: /apps/admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR per run for all minor and patch bumps, so lockfile changes land
    # together instead of as several PRs that each rewrite pnpm-lock.yaml.
    # Major bumps still arrive one per dependency for manual review.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # npm/pnpm — apps/kafka/package.json
  - package-ecosystem: npm
    directory: /apps/kafka
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR per run for all minor and patch bumps, so lockfile changes land
    # together instead of as several PRs that each rewrite pnpm-lock.yaml.
    # Major bumps still arrive one per dependency for manual review.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Dev containers
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
