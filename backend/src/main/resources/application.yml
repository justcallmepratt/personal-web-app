spring:
  application:
    name: resume
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.lob.non_contextual_creation: true
    show-sql: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8080}
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}
  expiry-ms: ${JWT_EXPIRY_MS:86400000}

cors:
  allowed-origins: ${CORS_ORIGIN:http://localhost:3000}

contact:
  notify-to: ${CONTACT_NOTIFY_TO:${MAIL_USER:}}
  rate-limit:
    max-submissions: ${CONTACT_RATE_LIMIT_MAX:3}
    window-seconds:  ${CONTACT_RATE_LIMIT_WINDOW:3600}

admin:
  # Failed sign-ins allowed per client address, and in total, within the window.
  login-rate-limit:
    max-attempts: ${ADMIN_LOGIN_MAX_ATTEMPTS:5}
    max-attempts-overall: ${ADMIN_LOGIN_MAX_ATTEMPTS_OVERALL:30}
    window-seconds: ${ADMIN_LOGIN_WINDOW_SECONDS:900}
  username: ${ADMIN_USERNAME:admin}
  password-hash: ${ADMIN_PASSWORD_HASH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false   # mail is optional; don't let unconfigured SMTP pull DOWN overall health

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.resume: INFO
